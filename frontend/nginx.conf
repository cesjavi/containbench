# Per-IP limits on everything that costs resources: every POST to the API (runs start
# containers, prompt generation and explanations call Vultr Inference) and report
# generation. GETs that only read stored data are not limited. Matters most in public
# demo mode (DEMO_PUBLIC=true), where there is no login in front of the API.
map $request_method $api_write_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $api_write_key      zone=api_writes:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_reports:1m rate=6r/m;
limit_req_status 429;

server {
    listen 80;
    server_name localhost;

    # Login (basic auth) or public demo access, chosen at container start by
    # docker-entrypoint.d/10-containbench-auth.sh from DEMO_PUBLIC.
    include /etc/nginx/containbench-auth.conf;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Room for the A/B quick demo (2 runs + 1 compare) and a few retries.
        limit_req zone=api_writes burst=6 nodelay;
        include /etc/nginx/containbench-api-proxy.conf;
    }

    # Reports are GETs but each one asks Vultr Inference to write the report.
    location ~ ^/api/runs/[^/]+/report$ {
        limit_req zone=api_reports burst=3 nodelay;
        include /etc/nginx/containbench-api-proxy.conf;
    }
}
