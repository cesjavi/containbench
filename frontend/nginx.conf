server {
    listen 80;
    server_name localhost;

    # Every page and API call requires a login. The password file is generated at
    # container start by docker-entrypoint.d/10-containbench-auth.sh.
    auth_basic "ContainBench";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Never forward a client-supplied key; nginx adds the real one below.
        proxy_set_header Authorization "";
        include /etc/nginx/containbench-api-key.conf;
        # A run can take AGENT_TIMEOUT_SECONDS (120) + CONTAINER_TIMEOUT_SECONDS (60)
        # + the Vultr explanation (~25) + setup; 180s cut long external-agent runs short.
        proxy_read_timeout 300s;
    }
}
