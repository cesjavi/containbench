# Shared proxy settings for every /api location (included from nginx.conf).
proxy_pass http://backend:8000;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Never forward a client-supplied key; nginx adds the real one below.
proxy_set_header Authorization "";
include /etc/nginx/containbench-api-key.conf;
# A run can take AGENT_TIMEOUT_SECONDS (120) + CONTAINER_TIMEOUT_SECONDS (60)
# + the Vultr explanation (up to 90) + setup.
proxy_read_timeout 300s;
